name: sayatsu
description: A modern, cross-platform manga/manhwa reader with custom source support, featuring a sleek dark-themed UI inspired by Anymex.
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.0
  riverpod_annotation: ^2.2.0

  # Local Database
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Networking
  dio: ^5.3.1
  connectivity_plus: ^5.0.0

  # UI & Animations
  flutter_staggered_grid_view: ^0.7.0
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0
  smooth_page_indicator: ^1.1.0
  page_transition: ^2.1.0

  # Utilities
  intl: ^0.19.0
  shared_preferences: ^2.2.0
  permission_handler: ^11.4.4
  path_provider: ^2.1.0
  logger: ^2.1.0

  # JSON Serialization
  freezed_annotation: ^2.4.1
  json_serializable: ^6.7.1

  # Extensions & Collections
  collection: ^1.18.0
  extensions: ^0.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.1
  build_runner: ^2.4.6
  freezed: ^2.4.5
  hive_generator: ^2.0.1
  riverpod_generator: ^2.3.3
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/logos/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
